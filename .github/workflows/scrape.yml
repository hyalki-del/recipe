name: Auto Scrape Recipes

on:
  schedule:
    - cron: '0 0 * * 1' # Runs automatically every Monday at midnight UTC
  workflow_dispatch:     # Allows you to trigger it manually anytime from GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required so GitHub Actions can push recipes.json back to your repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        uses: py-actions/pip-dependency-install@v4
        with:
          sub-path: ""
      - name: Install requirements manually
        run: pip install requests beautifulsoup4

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and push changes if JSON updated
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add recipes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of recipes.json" && git push)
