name: Auto Scrape Recipes

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight
  workflow_dispatch: # Allows you to run it manually from the GitHub Actions tab

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit changes back to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        run: python scraper.py

      - name: Commit and push changes if JSON updated
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add recipes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update recipes.json automatically" && git push)
