name: Clean Rec.json Workflow

on:
  workflow_dispatch: # Allows you to run this manually from the GitHub Actions tab
  push:
    paths:
      - 'rec.json'   # Automatically runs whenever you update rec.json

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    # Grants permissions for the workflow to push changes back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run recipe processing script
        run: python process_recipes.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rec.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-clean rec.json: keep only name, ingredients, instructions" && git push)
